[package]
name = "qimen-dynamic-plugin-ai-news"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
description = "QimenBot dynamic plugin that pushes Juya AI daily news to OneBot and QQ official groups"
repository = "https://github.com/lvyunqi/ai-news"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
abi-stable-host-api = "=0.1.13"
qimen-dynamic-plugin-derive = "=0.1.13"
abi_stable = "0.11"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
html-escape = "0.2"
infer = "0.19"
pulldown-cmark = "0.13"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "brotli", "deflate", "gzip", "rustls-tls"] }
rss = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
url = "2"

[dev-dependencies]
pretty_assertions = "1"
tiny_http = "0.12"
